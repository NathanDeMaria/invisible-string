[tool.poetry]
name = "invisible-string-backend"
version = "0.1.0"
description = "API over cassandra model results"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# ^3.14 because that's cassandra's floor, and cassandra is now a dependency.
python = "^3.14"
fastapi = "^0.121.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.0"
uvicorn = { extras = ["standard"], version = "^0.40.0" }
boto3 = "^1.41.0"
# The ModelRelease schema and the prob->margin predictors, pinned by rev
# (DESIGN.md sections 8 and 9.6). Bumping this is manual, and
# tests/test_schema_contract.py is what tells you the bump broke the artifact
# format.
#
# This deliberately does NOT bring scikit-learn: cassandra keeps it in a poetry
# `fit` group, and groups aren't part of package metadata. Reading a stored fit
# must never require the ability to produce one, so `No module named sklearn`
# in this image always means something is trying to *fit* -- the fix is never
# to add sklearn here.
cassandra = { git = "https://github.com/NathanDeMaria/cassandra.git", rev = "d4f57604ad536bda6f5e37b6efddca40c7af5e90" }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
httpx = "^0.28.1"
ruff = "^0.16.1"
ty = "^0.0.65"
moto = { extras = ["s3"], version = "^5.1.0" }
boto3-stubs = { extras = ["s3"], version = "^1.41.0" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
