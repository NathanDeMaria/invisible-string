[tool.poetry]
name = "invisible-string-backend"
version = "0.1.0"
description = "API over cassandra model results"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
# ^3.14 because that's cassandra's floor, and cassandra is now a dependency.
python = "^3.14"
fastapi = "^0.121.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.13.0"
uvicorn = { extras = ["standard"], version = "^0.40.0" }
boto3 = "^1.41.0"
# The ModelRelease schema and the prob->margin predictors, pinned by rev
# (DESIGN.md sections 8 and 9.6). Bumping this is manual, and
# tests/test_schema_contract.py is what tells you the bump broke the artifact
# format.
#
# This deliberately does NOT bring scikit-learn: cassandra keeps it in a poetry
# `fit` group, and groups aren't part of package metadata. Reading a stored fit
# must never require the ability to produce one, so `No module named sklearn`
# in this image always means something is trying to *fit* -- the fix is never
# to add sklearn here.
cassandra = { git = "https://github.com/NathanDeMaria/cassandra.git", rev = "785f888d230dae7f94865174adc097e5bb15cda1" }

# In-game win probability and EPA per play for football, pinned by rev the way
# cassandra is (DESIGN.md sections 16 and 16.8). The fits ship *inside* this
# package -- two per league now, win probability and expected points, in two
# files because they are fit separately -- so the pin is the model: "which
# curve is this drawing?" has one answer, the rev, and a retrain arrives here
# as a bump rather than as a file that changed in a bucket.
#
# The `data` extra and not `fit`. Upstream keeps them apart precisely so a
# consumer can say which half it means: `data` is pyarrow, for turning
# endgame's stored parquet into plays, and `fit` is scikit-learn, for
# producing a release. This app only ever reads one, and the same rule
# cassandra's dependency states applies here -- reading a stored fit must
# never require the ability to produce one.
#
# pyarrow is the heaviest thing in the image by some way (~150MB on disk), and
# section 16.3 is the argument for paying it: endgame's play-by-play is
# parquet, one object per league-week, and reading one game out of one is
# what makes a curve affordable at all. The solver behind `fit` buys nothing
# here, and this is how the dependency says so.
lucky-ones = { git = "https://github.com/NathanDeMaria/the-lucky-ones.git", rev = "87073d1f9e8d0a72c36a98efb66f9ca7ee3d590b", extras = ["data"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
httpx = "^0.28.1"
ruff = "^0.16.1"
ty = "^0.0.65"
moto = { extras = ["s3"], version = "^5.1.0" }
boto3-stubs = { extras = ["s3"], version = "^1.41.0" }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
