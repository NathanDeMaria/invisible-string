name: CI

on:
  # "**" not "*" -- a single star matches one path segment, so `["*"]` silently
  # skips every branch with a slash in it (claude/foo, feature/bar). The
  # workflow registers, shows as active, and simply never runs.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, so the `ci` gate below always has results to read. The
  # per-stack jobs are the ones that get skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Each stack also watches this workflow, so a change to CI itself
          # re-runs everything rather than silently skipping.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'openapi.json'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what ships (cassandra's floor); 3.13 is the current lower
        # bound while the ModelRelease schema still lives in this repo. Both
        # run until the cassandra dependency lands and 3.13 drops off.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      # Before setup-python, so its `cache: poetry` can find poetry on PATH.
      - name: Install poetry
        run: pipx install poetry

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: |
          poetry env use python
          poetry install

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The committed schema is what the frontend generates its types from, so
      # a response-model change that nobody exported has to fail here rather
      # than reach the browser as an undefined field.
      - name: OpenAPI schema is current
        run: |
          make openapi
          git diff --exit-code ../openapi.json

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # The other half of the contract: types regenerated from the committed
      # schema must match what's checked in.
      - name: Generated types are current
        run: make codegen-check

      - name: Build
        run: make build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          # `make lint` parses terraform's own output; the wrapper's extra
          # framing gets in the way and nothing here reads the step outputs.
          terraform_wrapper: false

      # fmt, init -backend=false, validate. No credentials and no state, so
      # this runs on forks and needs no OIDC role.
      - name: Lint
        run: make lint

  # The single required status check. Branch protection points at this and
  # nothing else, so path filters can skip whatever they like without leaving
  # a required check permanently pending.
  ci:
    needs: [changes, backend, frontend, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that nothing failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # Skipped is a pass -- that's the whole point of the path filters.
          # Only failure and cancellation are fatal.
          if jq -e 'to_entries
                    | map(select(.value.result == "failure"
                              or .value.result == "cancelled"))
                    | length > 0' <<< "$RESULTS" > /dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
          echo "all good"
