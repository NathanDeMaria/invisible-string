# Opens a pull request when a pinned git dependency's upstream has merged past
# the pin -- mostly cassandra -- on the branch `pins/<repository>`. The script
# that decides where each pin goes is cassandra's `bump_deps.py`, checked out
# from its main so the two repositories run one copy. `[tool.bump-deps]` in
# backend/pyproject.toml makes call-it-what-you-want and lucky-ones follow the
# revs cassandra pins, in cassandra's pull request. It also regenerates
# openapi.json and the frontend's types, which a new cassandra can change. Merging stays a person's.
name: Pins

on:
  # Upstream merges land at any time and nothing here hears about them, so
  # this polls. Off cassandra's minutes, so its own pin PRs aren't racing this.
  schedule:
    - cron: "22,52 * * * *"
  # `gh workflow run pins.yml` right after a cassandra merge, to skip the wait
  workflow_dispatch:

# Two runs would race each other's force-pushes
concurrency:
  group: pins
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # To start CI on the branch -- see the dispatch below
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # Public, so no token: just the one script, outside the working tree's
      # paths that get committed
      - uses: actions/checkout@v5
        with:
          repository: NathanDeMaria/cassandra
          path: .bump-tools
          sparse-checkout: bump_deps.py
          sparse-checkout-cone-mode: false

      # The same uv and interpreter as CI, so the lock is written by the
      # version that will check it
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # A new cassandra can change the API's response models, and CI fails on
      # a stale openapi.json or schema.d.ts, so the bump regenerates both
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Needs the repository setting "Allow GitHub Actions to create and
      # approve pull requests" (Settings > Actions > General). Without it the
      # branch is pushed and `gh pr create` fails, which fails the run.
      - name: Open or refresh a pull request per upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump() { uv run --no-project .bump-tools/bump_deps.py --pyproject backend/pyproject.toml "$@"; }
          failed=0
          # Assigned first so a failed lookup fails the step, where a `for`
          # over the substitution would loop zero times and report success.
          groups="$(bump list)"
          for group in $groups; do
            branch="pins/$group"
            git checkout --quiet -B "$branch" "$GITHUB_SHA"
            bump apply "$group" > "$RUNNER_TEMP/message.md"
            # A lock that will not resolve means the upstreams disagree about
            # a shared pin. Report it and carry on with the others.
            if ! (cd backend && uv lock); then
              echo "::error::uv lock failed for $group"
              failed=1
              git checkout --quiet -- .
              continue
            fi
            # The schema and the types generated from it follow the new pins
            if ! (cd backend && make openapi) || ! (cd frontend && npm run codegen); then
              echo "::error::regenerating the schema failed for $group"
              failed=1
              git checkout --quiet -- .
              continue
            fi
            git add backend/pyproject.toml backend/uv.lock openapi.json \
              frontend/src/api/schema.d.ts
            git commit --quiet --message "$(head -n 1 "$RUNNER_TEMP/message.md")"
            # Same tree as the branch already pushed: main and the upstream are
            # where they were, and pushing again would only re-run CI
            if git fetch --quiet origin "$branch" 2>/dev/null \
                && git diff --quiet FETCH_HEAD HEAD; then
              echo "$group: pull request is already current"
              continue
            fi
            git push --quiet --force origin "$branch"
            title="$(head -n 1 "$RUNNER_TEMP/message.md")"
            tail -n +3 "$RUNNER_TEMP/message.md" > "$RUNNER_TEMP/body.md"
            number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
            if [ -n "$number" ]; then
              gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            else
              gh pr create --head "$branch" --base main --title "$title" \
                --body-file "$RUNNER_TEMP/body.md"
            fi
            # A push made with the workflow's own token starts no workflows, so
            # the required `ci` check would never report. A dispatch is the one
            # event that token may raise; ci.yml accepts it for this.
            gh workflow run ci.yml --ref "$branch"
          done
          exit "$failed"
